<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Köttelmann App - Live</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        html {
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-slate-900">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 px-4 py-3 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-start">
            <div>
                <h1 class="text-lg font-bold tracking-wide text-amber-400">Autohaus Köttelmann</h1>
                <p class="text-[11px] text-slate-400 mt-0.5">Live-Modus via Worker</p>
            </div>
            <span class="text-xs bg-slate-700 px-2.5 py-1 rounded-full text-slate-300 font-mono">v0.0.5</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-md w-full mx-auto p-4 flex-grow space-y-4">
        <div id="loading-indicator" class="text-center py-10 text-slate-400 text-sm animate-pulse">
            Lade Live-Daten von der WDR-Mediathek...
        </div>
        <div id="episode-container" class="space-y-3">
            <!-- Dynamisch generierte Live-Karten -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 p-4 sticky bottom-0 z-40">
        <div class="max-w-md mx-auto text-center">
            <span class="text-xs text-slate-400 tracking-wider uppercase font-medium">Navigation</span>
        </div>
    </footer>

    <!-- JavaScript: Live-Fetch, Parser, Akkordeon & Audio-Player Steuerung -->
    <script>
        let activeAudio = null;
        let activeAudioUrl = null;
        let activeControlsContainer = null;

        const WORKER_URL = "https://koettelmann-proxy.m3-jost.workers.dev/?url=";
        const TARGET_WDR_URL = "https://www1.wdr.de/mediathek/audio/wdr4/autohaus-koettelmann/index.html";

        async function fetchAndParseLiveWDR() {
            const container = document.getElementById('episode-container');
            const loader = document.getElementById('loading-indicator');

            try {
                const response = await fetch(WORKER_URL + encodeURIComponent(TARGET_WDR_URL));
                if (!response.ok) throw new Error("Netzwerkfehler beim Abrufen des Proxies.");

                const htmlText = await response.text();
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                const sourceBoxes = doc.querySelectorAll('.box');
                
                loader.remove();
                container.innerHTML = '';

                if (sourceBoxes.length === 0) {
                    container.innerHTML = `<div class="text-center text-slate-400 py-6 text-sm">Keine Episoden im DOM gefunden.</div>`;
                    return;
                }

                sourceBoxes.forEach((box, index) => {
                    const titleEl = box.querySelector('h3 a');
                    const dateEl = box.querySelector('.mediaDate');
                    const durationEl = box.querySelector('.mediaDuration');
                    const expiryEl = box.querySelector('.mediaExpiry');
                    const audioEl = box.querySelector('.button.download') || box.querySelector('a[href*=".mp3"]');

                    if (!titleEl) return;

                    const title = titleEl.innerText.trim();
                    const date = dateEl ? dateEl.innerText.trim() : '';
                    const duration = durationEl ? durationEl.innerText.trim() : '';
                    const expires = expiryEl ? expiryEl.innerText.trim() : '';
                    const audioUrl = audioEl ? audioEl.getAttribute('href') : '';

                    const isOpen = (index === 0) ? 'open' : '';

                    const card = document.createElement('div');
                    card.className = "bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-sm transition hover:border-slate-600";
                    
                    card.innerHTML = `
                        <details class="group episode-details" ${isOpen}>
                            <summary class="flex justify-between items-center cursor-pointer list-none">
                                <span class="font-semibold text-amber-400 text-base">${title}</span>
                                <span class="transform transition-transform duration-200 group-open:rotate-180 text-slate-400 text-sm">&#9660;</span>
                            </summary>
                            <div class="mt-4 pt-3 border-t border-slate-700/60 space-y-2 text-sm text-slate-300">
                                <div class="flex justify-between">
                                    <span class="text-slate-400">Veröffentlichung:</span>
                                    <span class="font-medium">${date}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-slate-400">Laufzeit:</span>
                                    <span class="font-medium">${duration}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-slate-400">Verfügbarkeit:</span>
                                    <span class="font-medium text-emerald-400">${expires}</span>
                                </div>
                                ${audioUrl ? `
                                <div class="pt-3 space-y-2" id="player-box-${index}">
                                    <button onclick="initOrToggleAudio('${audioUrl}', this)" class="w-full py-2.5 px-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl transition flex items-center justify-center space-x-2 active:scale-95 shadow-sm main-play-btn">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
                                        </svg>
                                        <span>Audio starten</span>
                                    </button>
                                </div>` : `<div class="text-xs text-amber-500 pt-2">Kein direkter Download-Link gefunden.</div>`}
                            </div>
                        </details>
                    `;
                    container.appendChild(card);
                });

                // Exklusive Akkordeon-Logik (immer nur eine Karte offen)
                const allDetails = container.querySelectorAll('details.episode-details');
                allDetails.forEach(details => {
                    details.addEventListener('toggle', () => {
                        if (details.open) {
                            allDetails.forEach(other => {
                                if (other !== details) {
                                    other.removeAttribute('open');
                                }
                            });
                        }
                    });
                });

            } catch (err) {
                loader.innerHTML = `<span class="text-red-400">Fehler beim Laden der Live-Daten: ${err.message}</span>`;
            }
        }

        // Steuerung für Start, Pause/Fortsetzen und das Erstellen der Sprung-Buttons
        function initOrToggleAudio(url, btnElement) {
            const parentBox = btnElement.closest('.pt-3');

            // Wenn ein anderes Audio läuft, stoppen und UI zurücksetzen
            if (activeAudio && activeAudioUrl !== url) {
                activeAudio.pause();
                resetAllPlayerUIs();
            }

            if (!activeAudio || activeAudioUrl !== url) {
                // Neues Audio initialisieren
                activeAudio = new Audio(url);
                activeAudioUrl = url;
                activeControlsContainer = parentBox;

                activeAudio.play().catch(() => {});
                renderActivePlayerControls(parentBox, true);

                activeAudio.onended = () => {
                    resetAllPlayerUIs();
                    activeAudio = null;
                    activeAudioUrl = null;
                };
            } else {
                // Gleiches Audio: Zwischen Play und Pause umschalten
                if (activeAudio.paused) {
                    activeAudio.play().catch(() => {});
                    renderActivePlayerControls(parentBox, true);
                } else {
                    activeAudio.pause();
                    renderActivePlayerControls(parentBox, false);
                }
            }
        }

        function skipTime(seconds) {
            if (activeAudio) {
                let newTime = activeAudio.currentTime + seconds;
                if (newTime < 0) newTime = 0;
                if (newTime > activeAudio.duration) newTime = activeAudio.duration;
                activeAudio.currentTime = newTime;
            }
        }

        function renderActivePlayerControls(container, isPlaying) {
            // Erst alle anderen Player-Boxen auf den Standard-Startzustand zurücksetzen
            document.querySelectorAll('.episode-details').forEach(details => {
                const box = details.querySelector('.pt-3');
                if (box && box !== container) {
                    const btn = box.querySelector('.main-play-btn');
                    if (btn) {
                        box.innerHTML = `
                            <button onclick="initOrToggleAudio('${btn.dataset.url || getUrlFromBox(box)}', this)" class="w-full py-2.5 px-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl transition flex items-center justify-center space-x-2 active:scale-95 shadow-sm main-play-btn">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
                                </svg>
                                <span>Audio starten</span>
                            </button>
                        `;
                    }
                }
            });

            const playPauseIcon = isPlaying 
                ? `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg><span>Pause</span>`
                : `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" /></svg><span>Weiter</span>`;

            // Erweitertes Control-Panel mit -5s, Play/Pause und +5s
            container.innerHTML = `
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="skipTime(-5)" title="5 Sekunden zurück" class="py-2 px-2 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold rounded-xl transition flex items-center justify-center space-x-1 active:scale-95 text-xs shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
                        <span>-5s</span>
                    </button>
                    <button onclick="initOrToggleAudio('${activeAudioUrl}', this)" class="py-2.5 px-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl transition flex items-center justify-center space-x-1.5 active:scale-95 text-xs shadow-sm main-play-btn">
                        ${playPauseIcon}
                    </button>
                    <button onclick="skipTime(5)" title="5 Sekunden vor" class="py-2 px-2 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold rounded-xl transition flex items-center justify-center space-x-1 active:scale-95 text-xs shadow-sm">
                        <span>+5s</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>
                    </button>
                </div>
            `;
        }

        function resetAllPlayerUIs() {
            fetchAndParseLiveWDR(); // Lädt den Zustand sauber über den DOM neu zurück
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && activeAudio) {
                activeAudio.pause();
                activeAudio = null;
                activeAudioUrl = null;
                fetchAndParseLiveWDR();
            }
        });

        // Live-Abruf beim Start ausführen
        fetchAndParseLiveWDR();
    </script>
</body>
</html>
