<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Köttelmann App</title>
    <!-- Tailwind CSS CDN für modernes, mobiles Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Web App Manifest Verknüpfung -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        html {
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-slate-900">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 px-4 py-3 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-start">
            <div>
                <h1 class="text-lg font-bold tracking-wide text-amber-400">Autohaus Köttelmann</h1>
                <p class="text-[11px] text-slate-400 mt-0.5">Erstellt am: 16.09.2026, 10:10 Uhr</p>
            </div>
            <span class="text-xs bg-slate-700 px-2.5 py-1 rounded-full text-slate-300 font-mono">v0.0.2</span>
        </div>
    </header>

    <!-- Main Content Area (Bereinigt für zukünftige p-5 Card-Anker) -->
    <main class="max-w-md w-full mx-auto p-4 flex-grow space-y-4">
        <div id="episode-container" class="space-y-3">
            <!-- Hier werden zukünftig die geparsten Episoden im p-5 Card-Anker-Format eingefügt -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 p-4 sticky bottom-0 z-40">
        <div class="max-w-md mx-auto text-center">
            <span class="text-xs text-slate-400 tracking-wider uppercase font-medium">Navigation</span>
        </div>
    </footer>

    <!-- Service Worker Registrierung für PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('ServiceWorker registriert:', reg.scope))
                    .catch(err => console.log('ServiceWorker Fehler:', err));
            });
        }
    </script>
</body>
</html>
