<!-- === KÖTTELMANN APP - Version v53 === -->
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Köttelmann App - Live</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        html {
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #fbbf24;
            cursor: pointer;
            margin-top: -4px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #334155;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-slate-900">

    <!-- Splash Screen Overlay (Einmal täglich beim ersten Start) -->
    <div id="splash-screen" class="fixed inset-0 z-40 bg-slate-950 flex flex-col items-center justify-center p-4 transition-opacity duration-300 hidden cursor-pointer" onclick="dismissSplashScreen()" title="Zum Fortfahren antippen">
        <div class="max-w-sm w-full text-center space-y-4">
            <img src="img/splash.jpg" alt="Autohaus Köttelmann Splash" class="w-full rounded-2xl shadow-2xl border-2 border-amber-500 object-cover max-h-[75vh]">
            <p class="text-xs text-amber-400 font-medium animate-pulse">Zum Starten aufs Display tippen...</p>
        </div>
    </div>

    <!-- Header: 1,5-fache Höhe (h-24), glasklarer Hintergrund, vertikal zentriert, dunkles Versions-Badge unten links -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-md relative overflow-hidden h-24">
        <!-- Vollflächiges Hintergrundbild (absolut glasklar, ohne Overlay & ohne Blur) -->
        <div class="absolute inset-0 z-0">
            <img src="img/header2.jpg" alt="Header Hintergrund" class="w-full h-full object-cover">
        </div>

        <!-- Header Inhalt im Vordergrund (vertikal zentriert via Flexbox) -->
        <div class="max-w-md mx-auto h-full relative z-10 px-4 flex items-center justify-between">
            <!-- Echte Versionsnummer links unten mit dunklem Badge-Hintergrund (v53) -->
            <div class="absolute bottom-2 left-4">
                <span class="text-[11px] text-slate-100 font-mono font-bold px-2 py-0.5 rounded bg-slate-950/80 border border-slate-700/60 shadow-md tracking-wider">v53</span>
            </div>

            <!-- Platzhalter links für Layout-Balance -->
            <div></div>

            <!-- Titel-Block rechts mit präzisem Versatz (AUTOHAUS: -10, KÖTTELMANN: +10) -->
            <div class="flex flex-col items-end pr-1">
                <span class="text-2xl font-black tracking-wider text-white leading-tight transform -translate-x-10 drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">AUTOHAUS</span>
                <span class="text-2xl font-black tracking-wider text-white leading-tight transform translate-x-10 drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">KÖTTELMANN</span>
            </div>
        </div>
    </header>

    <!-- Main Content Area (p-5 Card-Anker) -->
    <main class="max-w-md w-full mx-auto p-4 flex-grow space-y-4 pb-24">
        <div id="episode-container" class="space-y-3">
            <!-- Dynamisch generierte Live-Karten -->
        </div>
    </main>

    <!-- Footer / Mitwandernde Paginierung -->
    <footer class="bg-slate-800 border-t border-slate-700 p-3.5 sticky bottom-0 z-20">
        <div class="max-w-md mx-auto">
            <div id="pagination-container" class="flex justify-between items-center gap-2 w-full">
                <!-- Wird per JS befüllt -->
            </div>
        </div>
    </footer>

    <!-- JavaScript: Service Worker, Live-Fetch, Audio & Splash -->
    <script>
        let activeAudio = null;
        let activeAudioUrl = null;
        let activePlayButton = null;
        let activeProgressBar = null;
        let activeCurrentTimeEl = null;
        let activeCardDetails = null;

        const WORKER_URL = "https://koettelmann-proxy.m3-jost.workers.dev/?url=";
        const BASE_TARGET_URL = "https://www1.wdr.de/mediathek/audio/wdr4/autohaus-koettelmann/";
        const STORAGE_KEY_COMPLETED = "koettelmann_completed_episodes";
        const STORAGE_KEY_FAVORITES = "koettelmann_favorite_episodes";
        const STORAGE_KEY_SPLASH = "koettelmann_splash_date";

        // Service Worker registrieren & Update-Prüfung beim Start erzwingen
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { scope: './' })
                    .then(reg => {
                        console.log('Service Worker registriert:', reg.scope);
                        reg.update();

                        reg.addEventListener('updatefound', () => {
                            const newWorker = reg.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    console.log('Neue PWA-Version im Hintergrund entdeckt und geladen.');
                                    window.location.reload();
                                }
                            });
                        });
                    })
                    .catch(err => console.log('Service Worker Fehler:', err));

                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (!refreshing) {
                        refreshing = true;
                        window.location.reload();
                    }
                });
            });
        }

        // App starten (Splash prüfen & Live-Daten laden)
        function initApp() {
            checkAndShowSplashScreen();
            fetchAndParseLiveWDR();
        }

        // Splash Screen Logik (einmal täglich beim ersten Start)
        function checkAndShowSplashScreen() {
            const todayStr = new Date().toDateString();
            const lastSplashDate = localStorage.getItem(STORAGE_KEY_SPLASH);
            
            if (lastSplashDate !== todayStr) {
                const splashEl = document.getElementById('splash-screen');
                if (splashEl) splashEl.classList.remove('hidden');
            }
        }

        function dismissSplashScreen() {
            const splashEl = document.getElementById('splash-screen');
            if (splashEl) {
                splashEl.classList.add('opacity-0');
                setTimeout(() => {
                    splashEl.classList.add('hidden');
                    splashEl.classList.remove('opacity-0');
                }, 300);
                localStorage.setItem(STORAGE_KEY_SPLASH, new Date().toDateString());
            }
        }

        // Hilfsfunktion zur Formatierung des Datums
        function formatFullDate(rawDateStr) {
            if (!rawDateStr) return '';
            const parts = rawDateStr.match(/(\d{2})\.(\d{2})\.(\d{4})/);
            if (parts) {
                const day = parseInt(parts[1], 10);
                const month = parseInt(parts[2], 10) - 1;
                const year = parseInt(parts[3], 10);
                const dateObj = new Date(year, month, day);
                if (!isNaN(dateObj.getTime())) {
                    const options = { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' };
                    return dateObj.toLocaleDateString('de-DE', options);
                }
            }
            return rawDateStr;
        }

        function getCompletedEpisodes() {
            try {
                const data = localStorage.getItem(STORAGE_KEY_COMPLETED);
                return data ? JSON.parse(data) : [];
            } catch (e) { return []; }
        }

        function setCompletedEpisodes(completedArray) {
            localStorage.setItem(STORAGE_KEY_COMPLETED, JSON.stringify(completedArray));
        }

        function isEpisodeCompleted(url) {
            return getCompletedEpisodes().includes(url);
        }

        function toggleCompletedEpisode(url, event) {
            event.stopPropagation();
            event.preventDefault();
            if (!url) return;

            const completed = getCompletedEpisodes();
            const index = completed.indexOf(url);
            const cardWrapper = event.currentTarget.closest('.episode-card-wrapper');

            if (index > -1) {
                completed.splice(index, 1);
                setCompletedEpisodes(completed);
                updateCardVisuals(cardWrapper, false);
            } else {
                completed.push(url);
                setCompletedEpisodes(completed);
                updateCardVisuals(cardWrapper, true);
            }
        }

        function updateCardVisuals(cardWrapper, isCompleted) {
            if (!cardWrapper) return;
            const badge = cardWrapper.querySelector('.status-badge');

            if (isCompleted) {
                cardWrapper.classList.remove('border-amber-500');
                cardWrapper.classList.add('border-emerald-500');
                if (badge) badge.classList.remove('hidden');
            } else {
                cardWrapper.classList.remove('border-emerald-500');
                cardWrapper.classList.add('border-amber-500');
                if (badge) badge.classList.add('hidden');
            }
        }

        function getFavoriteEpisodes() {
            try {
                const data = localStorage.getItem(STORAGE_KEY_FAVORITES);
                return data ? JSON.parse(data) : [];
            } catch (e) { return []; }
        }

        function isEpisodeFavorite(url) {
            return getFavoriteEpisodes().includes(url);
        }

        function toggleFavoriteEpisode(url, event) {
            event.stopPropagation();
            event.preventDefault();
            if (!url) return;
            
            const favorites = getFavoriteEpisodes();
            const index = favorites.indexOf(url);
            let isFav = false;

            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(url);
                isFav = true;
            }

            localStorage.setItem(STORAGE_KEY_FAVORITES, JSON.stringify(favorites));

            const starBtn = event.currentTarget;
            if (isFav) {
                starBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-amber-400 fill-amber-400" viewBox="0 0 20 20" fill="currentColor"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>`;
            } else {
                starBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400 hover:text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>`;
            }
        }

        function loadPage(pageNum) {
            if (activeAudio) {
                activeAudio.pause();
                activeAudio = null;
                activeAudioUrl = null;
                activePlayButton = null;
                activeProgressBar = null;
                activeCurrentTimeEl = null;
                activeCardDetails = null;
            }

            const targetUrl = pageNum === 1 
                ? BASE_TARGET_URL + "index.html" 
                : BASE_TARGET_URL + `autohaus-koettelmann-104~_pageaudio-${pageNum}_type-audio.html`;
            
            fetchAndParseLiveWDR(targetUrl, pageNum);
        }

        // Paginierung mit Sliding Window & Amber-Rahmen
        function renderPagination(currentPage, totalPages) {
            const navContainer = document.getElementById('pagination-container');
            navContainer.innerHTML = '';

            if (totalPages <= 1) return;

            const prevButton = document.createElement('button');
            prevButton.className = `px-5 py-3 rounded-xl transition flex items-center justify-center min-h-[44px] min-w-[50px] ${
                currentPage <= 1 
                    ? 'bg-slate-800 text-slate-600 cursor-not-allowed border border-slate-700/50' 
                    : 'bg-slate-700 text-slate-100 hover:bg-slate-600 active:scale-95 shadow-sm border border-amber-500'
            }`;
            prevButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 stroke-[2.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>`;
            prevButton.disabled = currentPage <= 1;
            prevButton.title = "Vorherige Seite";
            prevButton.addEventListener('click', () => {
                if (currentPage > 1) loadPage(currentPage - 1);
            });
            navContainer.appendChild(prevButton);

            const numbersWrapper = document.createElement('div');
            numbersWrapper.className = 'flex items-center gap-1.5 justify-center flex-grow mx-1';

            let startPage = Math.max(1, currentPage - 1);
            let endPage = startPage + 3;

            if (endPage > totalPages) {
                endPage = totalPages;
                startPage = Math.max(1, endPage - 3);
            }

            let pagesToShow = [];
            for (let i = startPage; i <= endPage; i++) {
                pagesToShow.push(i);
            }

            pagesToShow.forEach(item => {
                const button = document.createElement('button');
                const isActive = item === currentPage;
                
                button.className = `px-3.5 py-3 rounded-xl text-sm font-bold transition-colors min-h-[44px] min-w-[40px] flex items-center justify-center border border-amber-500 ${
                    isActive 
                        ? 'bg-amber-500 text-slate-950 font-extrabold shadow-md' 
                        : 'bg-slate-700 text-slate-200 hover:bg-slate-600 active:bg-slate-500'
                }`;
                button.textContent = item;

                button.addEventListener('click', () => {
                    loadPage(item);
                });

                numbersWrapper.appendChild(button);
            });

            navContainer.appendChild(numbersWrapper);

            const nextButton = document.createElement('button');
            nextButton.className = `px-5 py-3 rounded-xl transition flex items-center justify-center min-h-[44px] min-w-[50px] ${
                currentPage >= totalPages 
                    ? 'bg-slate-800 text-slate-600 cursor-not-allowed border border-slate-700/50' 
                    : 'bg-slate-700 text-slate-100 hover:bg-slate-600 active:scale-95 shadow-sm border border-amber-500'
            }`;
            nextButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 stroke-[2.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg>`;
            nextButton.disabled = currentPage >= totalPages;
            nextButton.title = "Nächste Seite";
            nextButton.addEventListener('click', () => {
                if (currentPage < totalPages) loadPage(currentPage + 1);
            });
            navContainer.appendChild(nextButton);
        }

        async function fetchAndParseLiveWDR(targetUrl = BASE_TARGET_URL + "index.html", pageNum = 1) {
            const container = document.getElementById('episode-container');
            container.innerHTML = '';

            const loader = document.createElement('div');
            loader.id = 'loading-indicator';
            loader.className = 'text-center py-10 text-amber-400 text-sm font-medium animate-pulse';
            loader.textContent = `Lade Live-Daten für Seite ${pageNum} von der WDR-Mediathek...`;
            container.appendChild(loader);

            try {
                const response = await fetch(WORKER_URL + encodeURIComponent(targetUrl));
                if (!response.ok) throw new Error("Netzwerkfehler beim Abrufen des Proxies.");

                const htmlText = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                
                const sourceBoxes = doc.querySelectorAll('.box');
                
                let totalPages = 1;
                const pagingEntries = doc.querySelectorAll('.mod.ico.paging .labels .entry, .controls.paging .labels .entry, .paging .entry');
                if (pagingEntries.length > 0) {
                    totalPages = pagingEntries.length;
                } else {
                    doc.querySelectorAll('a[href*="_pageaudio-"]').forEach(a => {
                        const match = a.href.match(/_pageaudio-(\d+)/);
                        if (match) {
                            const p = parseInt(match[1], 10);
                            if (p > totalPages) totalPages = p;
                        }
                    });
                }

                loader.remove();

                if (sourceBoxes.length === 0) {
                    container.innerHTML = `<div class="text-center text-slate-400 py-6 text-sm">Keine Episoden im DOM gefunden.</div>`;
                    renderPagination(pageNum, totalPages);
                    return;
                }

                sourceBoxes.forEach((box, index) => {
                    const titleEl = box.querySelector('h3 a');
                    const dateEl = box.querySelector('.mediaDate');
                    const durationEl = box.querySelector('.mediaDuration');
                    const expiryEl = box.querySelector('.mediaExpiry');
                    const audioEl = box.querySelector('.button.download') || box.querySelector('a[href*=".mp3"]');

                    if (!titleEl) return;

                    const title = titleEl.innerText.trim();
                    const rawDate = dateEl ? dateEl.innerText.trim() : '';
                    const formattedDate = formatFullDate(rawDate);
                    const duration = durationEl ? durationEl.innerText.trim() : '';
                    const expires = expiryEl ? expiryEl.innerText.trim() : '';
                    const audioUrl = audioEl ? audioEl.getAttribute('href') : '';

                    const isOpen = (index === 0 && pageNum === 1);
                    const completed = audioUrl && isEpisodeCompleted(audioUrl);
                    const isFav = audioUrl && isEpisodeFavorite(audioUrl);

                    const card = document.createElement('div');
                    const cardBorderClass = completed ? "border-2 border-emerald-500" : "border-2 border-amber-500";
                    
                    card.className = `bg-slate-800 ${cardBorderClass} rounded-2xl p-5 shadow-sm transition hover:opacity-95 episode-card-wrapper relative overflow-hidden ${isOpen ? 'open' : ''}`;
                    card.dataset.audioUrl = audioUrl;
                    
                    card.innerHTML = `
                        <!-- Wasserzeichen-Hintergrundbild mit 35% Sichtbarkeit im offenen Zustand -->
                        <div class="absolute inset-0 pointer-events-none opacity-0 transition-opacity duration-300 flex items-center justify-center overflow-hidden z-0 watermarked-bg ${isOpen ? 'opacity-35' : ''}">
                            <img src="img/splash.jpg" alt="Wasserzeichen" class="w-full h-full object-cover">
                        </div>

                        <div class="relative z-10 space-y-3">
                            <!-- Feste Kopfzeile: Titel, Status-Haken, Favoritenstern & Aufklapp-Pfeil -->
                            <div class="flex justify-between items-center cursor-pointer select-none" onclick="toggleDetails(this)">
                                <span class="font-semibold text-amber-400 text-base pr-2">${title}</span>
                                <div class="flex items-center space-x-2 flex-shrink-0" onclick="event.stopPropagation()">
                                    ${audioUrl ? `
                                    <button onclick="toggleCompletedEpisode('${audioUrl}', event)" title="Status wechseln (gehört/ungehört)" class="status-badge text-[10px] font-medium px-2 py-0.5 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800/60 transition active:scale-95 ${completed ? '' : 'hidden'}">
                                        ✓ Gehört
                                    </button>` : ''}
                                    
                                    ${audioUrl ? `
                                    <button onclick="toggleFavoriteEpisode('${audioUrl}', event)" title="Als Favorit markieren" class="p-1 transition active:scale-95 focus:outline-none">
                                        ${isFav ? `
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-amber-400 fill-amber-400" viewBox="0 0 20 20" fill="currentColor"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>` : `
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400 hover:text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>`}
                                    </button>` : ''}

                                    <button onclick="toggleDetails(this.parentElement.parentElement)" class="p-1 text-slate-400 hover:text-amber-400 transition focus:outline-none" title="Details öffnen/schließen">
                                        <span class="transform transition-transform duration-200 arrow-icon inline-block text-sm ${isOpen ? 'rotate-180' : ''}">&#9660;</span>
                                    </button>
                                </div>
                            </div>

                            <!-- Ausklappbarer Detail- und Player-Bereich -->
                            <div class="episode-details-content pt-3 border-t border-slate-700/60 space-y-3 text-sm text-slate-300 ${isOpen ? '' : 'hidden'}">
                                <div class="flex justify-between">
                                    <span class="text-slate-400">Veröffentlichung:</span>
                                    <span class="font-medium">${formattedDate}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-slate-400">Laufzeit:</span>
                                    <span class="font-medium">${duration}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-slate-400">Verfügbarkeit:</span>
                                    <span class="font-medium text-emerald-400">${expires}</span>
                                </div>
                                ${audioUrl ? `
                                <div class="pt-2 space-y-2">
                                    <div class="space-y-1">
                                        <input type="range" value="0" max="100" class="w-full progress-bar" oninput="seekAudio(this.value)">
                                        <div class="flex justify-between text-[11px] text-slate-400 font-mono">
                                            <span class="current-time">00:00</span>
                                            <span class="duration-time">${duration || '00:00'}</span>
                                        </div>
                                    </div>
                                    <div class="grid grid-cols-3 gap-2">
                                        <button onclick="skipTime(-5)" title="5 Sekunden zurück" class="py-2 px-2 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold rounded-xl transition flex items-center justify-center space-x-1 active:scale-95 text-xs shadow-sm border border-amber-500">
                                            <span>-5s</span>
                                        </button>
                                        <button onclick="toggleAudio('${audioUrl}', this)" title="Start / Pause" class="py-2.5 px-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl transition flex items-center justify-center space-x-1 active:scale-95 text-xs shadow-sm play-btn">
                                            <span>Start</span>
                                        </button>
                                        <button onclick="skipTime(5)" title="5 Sekunden vor" class="py-2 px-2 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold rounded-xl transition flex items-center justify-center space-x-1 active:scale-95 text-xs shadow-sm border border-amber-500">
                                            <span>+5s</span>
                                        </button>
                                    </div>
                                </div>` : `<div class="text-xs text-amber-500 pt-2">Kein direkter Download-Link gefunden.</div>`}
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });

                renderPagination(pageNum, totalPages);
                window.scrollTo({ top: 0, behavior: 'smooth' });

            } catch (err) {
                container.innerHTML = `<span class="text-red-400 text-center block py-10">Fehler beim Laden der Live-Daten: ${err.message}</span>`;
            }
        }

        // Hilfsfunktion zur Steuerung des Wasserzeichens beim Aufklappen
        function toggleDetails(element) {
            let cardWrapper = element.classList.contains('episode-card-wrapper') ? element : element.closest('.episode-card-wrapper');
            if (!cardWrapper) return;

            const detailsContent = cardWrapper.querySelector('.episode-details-content');
            const arrowIcon = cardWrapper.querySelector('.arrow-icon');
            const watermarkedBg = cardWrapper.querySelector('.watermarked-bg');
            const audioUrl = cardWrapper.dataset.audioUrl;

            // Accordion-Verhalten: Andere Boxen schließen
            document.querySelectorAll('.episode-card-wrapper').forEach(wrapper => {
                if (wrapper !== cardWrapper) {
                    const content = wrapper.querySelector('.episode-details-content');
                    const icon = wrapper.querySelector('.arrow-icon');
                    const bg = wrapper.querySelector('.watermarked-bg');
                    const otherAudioUrl = wrapper.dataset.audioUrl;

                    if (content && !content.classList.contains('hidden')) {
                        content.classList.add('hidden');
                        wrapper.classList.remove('open');
                        if (icon) icon.classList.remove('rotate-180');
                        if (bg) {
                            bg.classList.remove('opacity-35');
                            bg.classList.add('opacity-0');
                        }

                        if (activeAudio && activeAudioUrl === otherAudioUrl) {
                            activeAudio.pause();
                            const playBtn = wrapper.querySelector('.play-btn');
                            if (playBtn) playBtn.innerText = "Weiter";
                        }
                    }
                }
            });

            // Aktuelle Box umschalten
            const isHidden = detailsContent.classList.toggle('hidden');
            cardWrapper.classList.toggle('open', !isHidden);
            if (arrowIcon) arrowIcon.classList.toggle('rotate-180', !isHidden);
            
            if (watermarkedBg) {
                if (!isHidden) {
                    watermarkedBg.classList.remove('opacity-0');
                    watermarkedBg.classList.add('opacity-35');
                } else {
                    watermarkedBg.classList.remove('opacity-35');
                    watermarkedBg.classList.add('opacity-0');
                }
            }

            if (!isHidden && activeAudio && activeAudioUrl === audioUrl) {
                // Audio läuft im Hintergrund weiter
            } else if (isHidden && activeAudio && activeAudioUrl === audioUrl) {
                activeAudio.pause();
                const playBtn = cardWrapper.querySelector('.play-btn');
                if (playBtn) playBtn.innerText = "Weiter";
            }
        }

        function toggleAudio(url, btnElement) {
            const cardWrapper = btnElement.closest('.episode-card-wrapper');
            const progressBar = cardWrapper.querySelector('.progress-bar');
            const currentTimeEl = cardWrapper.querySelector('.current-time');
            const durationEl = cardWrapper.querySelector('.duration-time');

            if (activeAudio && activeAudioUrl !== url && activePlayButton) {
                activeAudio.pause();
                activePlayButton.innerText = "Start";
                if (activeProgressBar) activeProgressBar.value = 0;
            }

            if (!activeAudio || activeAudioUrl !== url) {
                if (activeAudio) activeAudio.pause();
                activeAudio = new Audio(url);
                activeAudioUrl = url;
                activePlayButton = btnElement;
                activeProgressBar = progressBar;
                activeCurrentTimeEl = currentTimeEl;
                activeCardDetails = cardWrapper;

                activeAudio.addEventListener('loadedmetadata', () => {
                    if (durationEl && activeAudio.duration) {
                        durationEl.innerText = formatTime(activeAudio.duration);
                    }
                });

                activeAudio.addEventListener('timeupdate', () => {
                    if (activeAudio && activeProgressBar) {
                        const progress = (activeAudio.currentTime / activeAudio.duration) * 100;
                        activeProgressBar.value = isNaN(progress) ? 0 : progress;
                        if (activeCurrentTimeEl) {
                            activeCurrentTimeEl.innerText = formatTime(activeAudio.currentTime);
                        }
                        if (activeAudio.duration && (activeAudio.duration - activeAudio.currentTime) <= 20) {
                            markAsCompletedAutomatic(cardWrapper, url);
                        }
                    }
                });

                activeAudio.play().catch(() => {});
                btnElement.innerText = "Pause";

                activeAudio.onended = () => {
                    markAsCompletedAutomatic(cardWrapper, url);
                    btnElement.innerText = "Start";
                    if (progressBar) progressBar.value = 0;
                    if (currentTimeEl) currentTimeEl.innerText = "00:00";
                    activeAudio = null;
                    activeAudioUrl = null;
                    activePlayButton = null;
                    activeCardDetails = null;
                };
            } else {
                if (activeAudio.paused) {
                    activeAudio.play().catch(() => {});
                    btnElement.innerText = "Pause";
                    activePlayButton = btnElement;
                } else {
                    activeAudio.pause();
                    btnElement.innerText = "Weiter";
                }
            }
        }

        function markAsCompletedAutomatic(cardWrapper, url) {
            if (!url) return;
            const completed = getCompletedEpisodes();
            if (!completed.includes(url)) {
                completed.push(url);
                setCompletedEpisodes(completed);
                updateCardVisuals(cardWrapper, true);
            }
        }

        function skipTime(seconds) {
            if (activeAudio && activeAudio.duration) {
                let newTime = activeAudio.currentTime + seconds;
                if (newTime < 0) newTime = 0;
                if (newTime > activeAudio.duration) newTime = activeAudio.duration;
                activeAudio.currentTime = newTime;
            }
        }

        function seekAudio(value) {
            if (activeAudio && activeAudio.duration) {
                const seekTime = (value / 100) * activeAudio.duration;
                activeAudio.currentTime = seekTime;
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        document.addEventListener('keydown', (e) => {
            e.key === 'Escape' && activeAudio && activeAudio.pause();
        });

        // App beim Laden initialisieren
        document.addEventListener('DOMContentLoaded', () => {
            initApp();
        });
    </script>
</body>
</html>
