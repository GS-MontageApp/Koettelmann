<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Autohaus Köttelmann App v0.0.1</title>
    <!-- Tailwind CSS CDN für modernes, responsives Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Zusätzliche mobile Optimierungen */
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-50">
        <h1 class="text-lg font-bold text-center">Autohaus Köttelmann</h1>
    </header>

    <!-- Hauptinhalt (Audiofolgen Container) -->
    <main class="flex-grow p-4 max-w-md mx-auto w-full pb-24">
        <div id="audio-container" class="space-y-4">
            <!-- Dynamisch geladene Audio-Cards (p-5) werden hier eingefügt -->
        </div>
    </main>

    <!-- Feste untere Paginierungs-Navigation (Mobile optimiert) -->
    <nav aria-label="Paginierung" class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-3 shadow-lg z-50">
        <div id="pagination-container" class="flex justify-center items-center gap-1.5 overflow-x-auto">
            <!-- Dynamische Paginierungs-Buttons werden hier gerendert -->
        </div>
    </nav>

    <!-- App Logik -->
    <script>
        // Konfiguration & Mock-Daten zur Simulation der WDR-Struktur (z.B. 12 Seiten total für den Test)
        const totalPages = 12; 
        const baseUrlPattern = "https://www1.wdr.de/mediathek/audio/wdr4/autohaus-koettelmann/autohaus-koettelmann-104~_pageaudio-PAGE_NUM_type-audio.html";

        // Funktion zum Laden und Rendern der Audios einer spezifischen Seite (Inhalts-Cleanup inklusive)
        function loadPage(pageNum) {
            const container = document.getElementById('audio-container');
            
            // 1. Inhalts-Cleanup: Vorherige Audios komplett entfernen, um Doppelungen zu verhindern
            container.innerHTML = '';

            // Ladeindikator oder Status anzeigen
            const loadingIndicator = document.createElement('div');
            loadingIndicator.className = 'bg-white p-5 rounded-xl shadow-sm text-center text-slate-500 animate-pulse';
            loadingIndicator.textContent = `Lade Folge für Seite ${pageNum}...`;
            container.appendChild(loadingIndicator);

            // Simulation des Ladens (Hier würde später der echte Fetch/Parser greifen)
            setTimeout(() => {
                container.innerHTML = ''; // Ladeindikator entfernen

                // Beispielhafte Generierung von 3 Audio-Einträgen pro Seite im p-5 Card-Anker Stil
                for (let i = 1; i <= 3; i++) {
                    const card = document.createElement('div');
                    card.className = 'bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col gap-2';
                    
                    card.innerHTML = `
                        <div class="text-xs font-semibold text-blue-600 uppercase tracking-wide">Seite ${pageNum}</div>
                        <h2 class="text-base font-bold text-slate-900">Folge ${((pageNum - 1) * 3) + i}: Neues aus der Werkstatt</h2>
                        <p class="text-sm text-slate-600">Beschreibung zur Episode von Autohaus Köttelmann auf Unterseite ${pageNum}.</p>
                        <div class="mt-2 text-xs text-slate-400">Ziel-URL: ..._pageaudio-${pageNum}_type-audio.html</div>
                    `;
                    container.appendChild(card);
                }

                // Paginierung neu rendern, um den aktiven Zustand anzupassen
                renderPagination(pageNum);
                
                // Nach oben scrollen für optimalen Lesekomfort auf dem Smartphone
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 300);
        }

        // Dynamische Generierung der Paginierung nach WDR-Vorbild mit Punkten-Platzhaltern für große Seitenmengen
        function renderPagination(currentPage) {
            const navContainer = document.getElementById('pagination-container');
            navContainer.innerHTML = '';

            let pagesToShow = [];

            if (totalPages <= 7) {
                // Wenn es wenige Seiten gibt, alle anzeigen
                for (let i = 1; i <= totalPages; i++) {
                    pagesToShow.push(i);
                }
            } else {
                // Intelligente Reduzierung mit Punkten-Platzhaltern bei vielen Seiten (z.B. 100 Seiten)
                pagesToShow.push(1);
                if (currentPage > 3) pagesToShow.push('...');

                let start = Math.max(2, currentPage - 1);
                let end = Math.min(totalPages - 1, currentPage + 1);

                for (let i = start; i <= end; i++) {
                    pagesToShow.push(i);
                }

                if (currentPage < totalPages - 2) pagesToShow.push('...');
                pagesToShow.push(totalPages);
            }

            // Buttons ins DOM einfügen
            pagesToShow.forEach(item => {
                if (item === '...') {
                    const span = document.createElement('span');
                    span.className = 'px-2 text-slate-400 font-bold select-none';
                    span.textContent = '…';
                    navContainer.appendChild(span);
                } else {
                    const button = document.createElement('button');
                    const isActive = item === currentPage;
                    
                    button.className = `px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors ${
                        isActive 
                            ? 'bg-blue-600 text-white shadow-sm' 
                            : 'bg-slate-100 text-slate-700 hover:bg-slate-200 active:bg-slate-300'
                    }`;
                    button.textContent = item;
                    
                    // URL-Muster im Hintergrund hinterlegen (kann per Attribut oder Klick-Event genutzt werden)
                    const targetUrl = baseUrlPattern.replace('PAGE_NUM', item);
                    button.setAttribute('data-url', targetUrl);

                    // Klick-Event: Seite wechseln & Cleanup ausführen
                    button.addEventListener('click', () => {
                        loadPage(item);
                    });

                    navContainer.appendChild(button);
                }
            });
        }

        // Initialer Start beim Laden der App (wir starten auf Seite 1)
        document.addEventListener('DOMContentLoaded', () => {
            loadPage(1);
        });
    </script>
</body>
</html>
