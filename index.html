<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Köttelmann App - Live</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        html {
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #fbbf24;
            cursor: pointer;
            margin-top: -4px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #334155;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-slate-900">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 px-4 py-3 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-start">
            <div>
                <h1 class="text-lg font-bold tracking-wide text-amber-400">Autohaus Köttelmann</h1>
                <p class="text-[11px] text-slate-400 mt-0.5">Live-Modus via Worker</p>
            </div>
            <span class="text-xs bg-slate-700 px-2.5 py-1 rounded-full text-slate-300 font-mono">v0.0.12</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-md w-full mx-auto p-4 flex-grow space-y-4">
        <div id="loading-indicator" class="text-center py-10 text-slate-400 text-sm animate-pulse">
            Lade Live-Daten von der WDR-Mediathek...
        </div>
        <div id="episode-container" class="space-y-3">
            <!-- Dynamisch generierte Live-Karten -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 p-4 sticky bottom-0 z-40">
        <div class="max-w-md mx-auto text-center">
            <span class="text-xs text-slate-400 tracking-wider uppercase font-medium">Navigation</span>
        </div>
    </footer>

    <!-- JavaScript: Live-Fetch, Parser, Akkordeon, Audio-Steuerung, Gehört-Toggle & Favoriten-Stern -->
    <script>
        let activeAudio = null;
        let activeAudioUrl = null;
        let activePlayButton = null;
        let activeProgressBar = null;
        let activeCurrentTimeEl = null;
        let activeCardDetails = null;

        const WORKER_URL = "https://koettelmann-proxy.m3-jost.workers.dev/?url=";
        const TARGET_WDR_URL = "https://www1.wdr.de/mediathek/audio/wdr4/autohaus-koettelmann/index.html";
        const STORAGE_KEY_COMPLETED = "koettelmann_completed_episodes";
        const STORAGE_KEY_FAVORITES = "koettelmann_favorite_episodes";

        // LocalStorage Hilfsfunktionen für Gehört-Status
        function getCompletedEpisodes() {
            try {
                const data = localStorage.getItem(STORAGE_KEY_COMPLETED);
                return data ? JSON.parse(data) : [];
            } catch (e) { return []; }
        }

        function setCompletedEpisodes(completedArray) {
            localStorage.setItem(STORAGE_KEY_COMPLETED, JSON.stringify(completedArray));
        }

        function isEpisodeCompleted(url) {
            return getCompletedEpisodes().includes(url);
        }

        function toggleCompletedEpisode(url, event) {
            event.stopPropagation(); // Verhindert das Auf/Zuklappen der Akkordeon-Karte
            if (!url) return;

            const completed = getCompletedEpisodes();
            const index = completed.indexOf(url);
            const cardDetails = event.currentTarget.closest('details');

            if (index > -1) {
                // Entfernen (wieder als ungehört markieren)
                completed.splice(index, 1);
                setCompletedEpisodes(completed);
                updateCardVisuals(cardDetails, false);
            } else {
                // Hinzufügen (als gehört markieren)
                completed.push(url);
                setCompletedEpisodes(completed);
                updateCardVisuals(cardDetails, true);
            }
        }

        function updateCardVisuals(cardDetails, isCompleted) {
            if (!cardDetails) return;
            const wrapper = cardDetails.closest('.episode-card-wrapper');
            const badge = cardDetails.querySelector('.status-badge');

            if (isCompleted) {
                if (wrapper) {
                    wrapper.classList.remove('border', 'border-slate-700');
                    wrapper.classList.add('border-2', 'border-emerald-500');
                }
                if (badge) badge.classList.remove('hidden');
            } else {
                if (wrapper) {
                    wrapper.classList.remove('border-2', 'border-emerald-500');
                    wrapper.classList.add('border', 'border-slate-700');
                }
                if (badge) badge.classList.add('hidden');
            }
        }

        // LocalStorage Hilfsfunktionen für Favoriten
        function getFavoriteEpisodes() {
            try {
                const data = localStorage.getItem(STORAGE_KEY_FAVORITES);
                return data ? JSON.parse(data) : [];
            } catch (e) { return []; }
        }

        function toggleFavoriteEpisode(url, event) {
            event.stopPropagation();
            if (!url) return;
            
            const favorites = getFavoriteEpisodes();
            const index = favorites.indexOf(url);
            let isFav = false;

            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(url);
                isFav = true;
            }

            localStorage.setItem(STORAGE_KEY_FAVORITES, JSON.stringify(favorites));

            const starBtn = event.currentTarget;
            if (isFav) {
                starBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-amber-400 fill-amber-400" viewBox="0 0 20 20" fill="currentColor"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>`;
            } else {
                starBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400 hover:text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>`;
            }
        }

        function isEpisodeFavorite(url) {
            return getFavoriteEpisodes().includes(url);
        }

        async function fetchAndParseLiveWDR() {
            const container = document.getElementById('episode-container');
            const loader = document.getElementById('loading-indicator');

            try {
                const response = await fetch(WORKER_URL + encodeURIComponent(TARGET_WDR_URL));
                if (!response.ok) throw new Error("Netzwerkfehler beim Abrufen des Proxies.");

                const htmlText = await response.text();
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                const sourceBoxes = doc.querySelectorAll('.box');
                
                loader.remove();
                container.innerHTML = '';

                if (sourceBoxes.length === 0) {
                    container.innerHTML = `<div class="text-center text-slate-400 py-6 text-sm">Keine Episoden im DOM gefunden.</div>`;
                    return;
                }

                sourceBoxes.forEach((box, index) => {
                    const titleEl = box.querySelector('h3 a');
                    const dateEl = box.querySelector('.mediaDate');
                    const durationEl = box.querySelector('.mediaDuration');
                    const expiryEl = box.querySelector('.mediaExpiry');
                    const audioEl = box.querySelector('.button.download') || box.querySelector('a[href*=".mp3"]');

                    if (!titleEl) return;

                    const title = titleEl.innerText.trim();
                    const date = dateEl ? dateEl.innerText.trim() : '';
                    const duration = durationEl ? durationEl.innerText.trim() : '';
                    const expires = expiryEl ? expiryEl.innerText.trim() : '';
                    const audioUrl = audioEl ? audioEl.getAttribute('href') : '';

                    const isOpen = (index === 0) ? 'open' : '';
                    const completed = audioUrl && isEpisodeCompleted(audioUrl);
                    const isFav = audioUrl && isEpisodeFavorite(audioUrl);

                    const card = document.createElement('div');
                    const cardBorderClass = completed ? "border-2 border-emerald-500" : "border border-slate-700";
                    card.className = `bg-slate-800 ${cardBorderClass} rounded-2xl p-5 shadow-sm transition hover:border-slate-600 episode-card-wrapper`;
                    
                    card.innerHTML = `
                        <details class="group episode-details" data-audio-url="${audioUrl}" ${isOpen}>
                            <summary class="flex justify-between items-center cursor-pointer list-none">
                                <span class="font-semibold text-amber-400 text-base pr-2">${title}</span>
                                <div class="flex items-center space-x-2 flex-shrink-0">
                                    <!-- Gehört-Badge als klickbarer Toggle-Button (jetzt links) -->
                                    ${audioUrl ? `
                                    <button onclick="toggleCompletedEpisode('${audioUrl}', event)" title="Status wechseln (gehört/ungehört)" class="status-badge text-[10px] font-medium px-2 py-0.5 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800/60 transition active:scale-95 ${completed ? '' : 'hidden'}">
                                        ✓ Gehört
                                    </button>` : ''}
                                    
                                    <!-- Favoriten-Stern (jetzt rechts) -->
                                    ${audioUrl ? `
                                    <button onclick="toggleFavoriteEpisode('${audioUrl}', event)" title="Als Favorit markieren" class="p-1 transition active:scale-95 focus:outline-none">
                                        ${isFav ? `
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-amber-400 fill-amber-400" viewBox="0 0 20 20" fill="currentColor"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>` : `
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400 hover:text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>`}
                                    </button>` : ''}

                                    <span class="transform transition-transform duration-200 group-open:rotate-180 text-slate-400 text-sm">&#9660;</span>
                                </div>
                            </summary>
                            <div class="mt-4 pt-3 border-t border-slate-700/60 space-y-3 text-sm text-slate-300">
                                <div class="flex justify-between">
                                    <span class="text-slate-400">Veröffentlichung:</span>
                                    <span class="font-medium">${date}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-slate-400">Laufzeit:</span>
                                    <span class="font-medium">${duration}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-slate-400">Verfügbarkeit:</span>
                                    <span class="font-medium text-emerald-400">${expires}</span>
                                </div>
                                ${audioUrl ? `
                                <div class="pt-2 space-y-2">
                                    <div class="space-y-1">
                                        <input type="range" value="0" max="100" class="w-full progress-bar" oninput="seekAudio(this.value)">
                                        <div class="flex justify-between text-[11px] text-slate-400 font-mono">
                                            <span class="current-time">00:00</span>
                                            <span class="duration-time">${duration || '00:00'}</span>
                                        </div>
                                    </div>
                                    <div class="grid grid-cols-3 gap-2">
                                        <button onclick="skipTime(-5)" title="5 Sekunden zurück" class="py-2 px-2 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold rounded-xl transition flex items-center justify-center space-x-1 active:scale-95 text-xs shadow-sm">
                                            <span>-5s</span>
                                        </button>
                                        <button onclick="toggleAudio('${audioUrl}', this)" title="Start / Pause" class="py-2.5 px-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl transition flex items-center justify-center space-x-1 active:scale-95 text-xs shadow-sm play-btn">
                                            <span>Start</span>
                                        </button>
                                        <button onclick="skipTime(5)" title="5 Sekunden vor" class="py-2 px-2 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold rounded-xl transition flex items-center justify-center space-x-1 active:scale-95 text-xs shadow-sm">
                                            <span>+5s</span>
                                        </button>
                                    </div>
                                </div>` : `<div class="text-xs text-amber-500 pt-2">Kein direkter Download-Link gefunden.</div>`}
                            </div>
                        </details>
                    `;
                    container.appendChild(card);
                });

                // Exklusive Akkordeon-Logik (immer nur eine Karte offen)
                const allDetails = container.querySelectorAll('details.episode-details');
                allDetails.forEach(details => {
                    details.addEventListener('toggle', () => {
                        if (details.open) {
                            allDetails.forEach(other => {
                                if (other !== details) {
                                    other.removeAttribute('open');
                                }
                            });
                        }
                    });
                });

            } catch (err) {
                loader.innerHTML = `<span class="text-red-400">Fehler beim Laden der Live-Daten: ${err.message}</span>`;
            }
        }

        function toggleAudio(url, btnElement) {
            const cardDetails = btnElement.closest('details');
            const progressBar = cardDetails.querySelector('.progress-bar');
            const currentTimeEl = cardDetails.querySelector('.current-time');
            const durationEl = cardDetails.querySelector('.duration-time');

            if (activeAudio && activeAudioUrl !== url && activePlayButton) {
                activeAudio.pause();
                activePlayButton.innerText = "Start";
                if (activeProgressBar) activeProgressBar.value = 0;
            }

            if (!activeAudio || activeAudioUrl !== url) {
                if (activeAudio) activeAudio.pause();
                activeAudio = new Audio(url);
                activeAudioUrl = url;
                activePlayButton = btnElement;
                activeProgressBar = progressBar;
                activeCurrentTimeEl = currentTimeEl;
                activeCardDetails = cardDetails;

                activeAudio.addEventListener('loadedmetadata', () => {
                    if (durationEl && activeAudio.duration) {
                        durationEl.innerText = formatTime(activeAudio.duration);
                    }
                });

                activeAudio.addEventListener('timeupdate', () => {
                    if (activeAudio && activeProgressBar) {
                        const progress = (activeAudio.currentTime / activeAudio.duration) * 100;
                        activeProgressBar.value = isNaN(progress) ? 0 : progress;
                        if (activeCurrentTimeEl) {
                            activeCurrentTimeEl.innerText = formatTime(activeAudio.currentTime);
                        }

                        // Automatisch als gehört markieren bei $\le 20$ Sek Restlaufzeit
                        if (activeAudio.duration && (activeAudio.duration - activeAudio.currentTime) <= 20) {
                            markAsCompletedAutomatic(cardDetails, url);
                        }
                    }
                });

                activeAudio.play().catch(() => {});
                btnElement.innerText = "Pause";

                activeAudio.onended = () => {
                    markAsCompletedAutomatic(cardDetails, url);
                    btnElement.innerText = "Start";
                    if (progressBar) progressBar.value = 0;
                    if (currentTimeEl) currentTimeEl.innerText = "00:00";
                    activeAudio = null;
                    activeAudioUrl = null;
                    activePlayButton = null;
                    activeCardDetails = null;
                };
            } else {
                if (activeAudio.paused) {
                    activeAudio.play().catch(() => {});
                    btnElement.innerText = "Pause";
                    activePlayButton = btnElement;
                } else {
                    activeAudio.pause();
                    btnElement.innerText = "Weiter";
                }
            }
        }

        function markAsCompletedAutomatic(cardDetails, url) {
            if (!url) return;
            const completed = getCompletedEpisodes();
            if (!completed.includes(url)) {
                completed.push(url);
                setCompletedEpisodes(completed);
                updateCardVisuals(cardDetails, true);
            }
        }

        function skipTime(seconds) {
            if (activeAudio && activeAudio.duration) {
                let newTime = activeAudio.currentTime + seconds;
                if (newTime < 0) newTime = 0;
                if (newTime > activeAudio.duration) newTime = activeAudio.duration;
                activeAudio.currentTime = newTime;
            }
        }

        function seekAudio(value) {
            if (activeAudio && activeAudio.duration) {
                const seekTime = (value / 100) * activeAudio.duration;
                activeAudio.currentTime = seekTime;
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && activeAudio) {
                activeAudio.pause();
                if (activePlayButton) activePlayButton.innerText = "Start";
                if (activeProgressBar) activeProgressBar.value = 0;
                if (activeAudioUrl && activeAudio.duration && (activeAudio.duration - activeAudio.currentTime) <= 20) {
                    markAsCompletedAutomatic(activeCardDetails, activeAudioUrl);
                }
                activeAudio = null;
                activeAudioUrl = null;
                activePlayButton = null;
                activeCardDetails = null;
            }
        });

        // Live-Abruf beim Start ausführen
        fetchAndParseLiveWDR();
    </script>
</body>
</html>
