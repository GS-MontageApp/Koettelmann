<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Köttelmann App</title>
    <!-- Tailwind CSS CDN für modernes, mobiles Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Web App Manifest Verknüpfung -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        html {
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-slate-900">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 px-4 py-3 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold tracking-wide text-amber-400">Autohaus Köttelmann</h1>
            <span class="text-xs bg-slate-700 px-2.5 py-1 rounded-full text-slate-300">v0.0.1</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-md w-full mx-auto p-4 flex-grow space-y-4">
        
        <!-- Info / Status -->
        <div class="p-4 bg-slate-800/80 border border-slate-700 rounded-2xl shadow-sm">
            <p class="text-sm text-slate-300">PWA-Container bereit. Die App ist für den mobilen Betrieb auf S24 &amp; iOS optimiert.</p>
        </div>

        <!-- Container für Episoden (p-5 Card-Anker Struktur) -->
        <div id="episode-container" class="space-y-3">
            <!-- Beispiel-Card in p-5 Struktur -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-sm transition hover:border-slate-600">
                <details class="group" open>
                    <summary class="flex justify-between items-center cursor-pointer list-none">
                        <span class="font-semibold text-amber-400 text-base">System bereit</span>
                        <span class="transform transition-transform duration-200 group-open:rotate-180 text-slate-400 text-sm">&#9660;</span>
                    </summary>
                    <div class="mt-4 pt-3 border-t border-slate-700/60 space-y-2 text-sm text-slate-300">
                        <div class="flex justify-between">
                            <span class="text-slate-400">Status:</span>
                            <span class="font-medium text-emerald-400">Aktiv</span>
                        </div>
                    </div>
                </details>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 p-4 sticky bottom-0 z-40">
        <div class="max-w-md mx-auto text-center space-y-1">
            <div class="text-xs text-slate-400">Zangen-App statt Probleme</div>
            <div class="text-[10px] text-slate-500">Optimiert für S24 &amp; iOS</div>
        </div>
    </footer>

    <!-- Service Worker Registrierung für PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('ServiceWorker registriert:', reg.scope))
                    .catch(err => console.log('ServiceWorker Fehler:', err));
            });
        }
    </script>
</body>
</html>
